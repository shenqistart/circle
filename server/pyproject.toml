[project]
name = "roundtable-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai-agents>=0.17.0",
  "pydantic>=2.13.4",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "uvicorn>=0.30.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
