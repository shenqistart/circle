[project]
name = "roundtable-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.137.0",
  "httpx>=0.27.0",
  "openai-agents>=0.17.5",
  "pydantic>=2.13.4",
  "pytest>=9.1.0",
  "pytest-asyncio>=1.4.0",
  "uvicorn>=0.49.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
